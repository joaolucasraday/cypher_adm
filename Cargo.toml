[package]
name = "cypher-adm"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower-http = { version = "0.5", features = ["cors"] }
# Runtime da Vercel para Serverless Functions em Rust:
vercel_runtime = { version = "2" }

# Declara o entrypoint da Vercel
[[bin]]
name = "main"
path = "api/main.rs"